version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crawler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/crawler?sslmode=disable
      ALLOWED_ORIGINS: http://localhost:3000
      RETENTION_HOURS: 72
      RUN_CREATE_RATE_LIMIT: 10
      RUN_CREATE_RATE_WINDOW: 1m
      DEFAULT_MAX_PAGES: 2000
      DEFAULT_TIME_BUDGET: 5m
      DEFAULT_MAX_LINKS_PER_PAGE: 100
      DEFAULT_GLOBAL_CONCURRENCY: 32
      DEFAULT_PER_HOST_CONCURRENCY: 4
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
